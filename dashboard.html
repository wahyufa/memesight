<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GMGN Scanner</title>
<style>
:root {
  --bg:    #0b0e11;
  --srf:   #131720;
  --srf2:  #181d2a;
  --bd:    #1e2535;
  --muted: #4a5568;
  --dim:   #7a8ba0;
  --text:  #c8d3e0;
  --hi:    #eaf0f8;
  --green: #00c076;
  --yel:   #f0b90b;
  --org:   #e8722a;
  --red:   #f6465d;
  --blue:  #4f8fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px}

/* ── topbar ── */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;height:46px;
  background:var(--srf);border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:100;
}
.logo{font-size:14px;font-weight:700;color:var(--hi);letter-spacing:-.3px}
.logo em{color:var(--green);font-style:normal}
.stat{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.stat b{color:var(--text);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:blink 2s infinite}
.dot.off{background:var(--red);box-shadow:0 0 5px var(--red);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nfa{font-size:10px;color:var(--muted);border:1px solid var(--bd);border-radius:3px;padding:2px 7px}
.lastupd{font-size:11px;color:var(--muted)}

/* ── sort bar ── */
.sortbar{
  display:flex;align-items:center;gap:6px;
  padding:8px 18px;
  background:var(--bg);border-bottom:1px solid var(--bd);
  position:sticky;top:46px;z-index:99;
  flex-wrap:wrap;
}
.sortbar-label{font-size:11px;color:var(--muted);margin-right:4px}
.sb{
  padding:4px 12px;font-size:11px;font-weight:600;border-radius:4px;
  background:var(--srf2);border:1px solid var(--bd);color:var(--dim);
  cursor:pointer;user-select:none;transition:all .15s;
}
.sb:hover{color:var(--text);border-color:var(--dim)}
.sb.on{background:#261e00;border-color:#4a3200;color:var(--yel)}
.filter-sep{width:1px;height:16px;background:var(--bd);margin:0 4px}
.type-filter{display:flex;align-items:center;gap:4px}
.tf{
  padding:4px 10px;font-size:11px;font-weight:700;border-radius:4px;
  border:1px solid var(--bd);cursor:pointer;user-select:none;transition:all .15s;
}
.tf-all{background:var(--srf2);color:var(--dim)}
.tf-all.on{background:#1a2030;border-color:var(--blue);color:var(--blue)}
.tf-new{background:var(--srf2);color:var(--dim)}
.tf-new.on{background:#0d1f30;border-color:#1a3a54;color:var(--blue)}
.tf-near{background:var(--srf2);color:var(--dim)}
.tf-near.on{background:#2a1c00;border-color:#4a3200;color:var(--yel)}
.tf-grad{background:var(--srf2);color:var(--dim)}
.tf-grad.on{background:#0a2e1a;border-color:#0d4a28;color:var(--green)}

/* ── table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}

thead th{
  padding:9px 14px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);text-align:left;white-space:nowrap;
  background:var(--bg);border-bottom:1px solid var(--bd);
}

tbody tr{border-bottom:1px solid var(--bd);transition:background .1s}
tbody tr:hover{background:var(--srf2)}
tbody tr.hit{background:#0a1f14}
tbody tr.hit:hover{background:#0d2618}
td{padding:11px 14px;vertical-align:middle;white-space:nowrap}

/* ── token cell ── */
.tok{display:flex;align-items:center;gap:9px}
.ico{
  width:30px;height:30px;border-radius:50%;
  background:var(--srf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--dim);flex-shrink:0;text-transform:uppercase
}
.tok-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.sym{font-size:13px;font-weight:700;color:var(--hi)}
.tname{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:130px}
.addr{font-size:10px;color:var(--muted);font-family:monospace;cursor:pointer;opacity:.6;transition:opacity .1s}
.addr:hover{opacity:1;color:var(--dim)}

/* ── type badge ── */
.type-new {display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:#0d1f30;color:#4f8fff;border:1px solid #1a3a54}
.type-near{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:#2a1c00;color:#f0b90b;border:1px solid #4a3200}
.type-grad{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:#0a2e1a;color:#00c076;border:1px solid #0d4a28}

/* ── action ── */
.act{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.a-buy  {background:#0a2e1a;color:#00c076;border:1px solid #0d4a28}
.a-watch{background:#2a1c00;color:#f0b90b;border:1px solid #4a3200}
.a-wait {background:#1a1f28;color:#7a8ba0;border:1px solid #252d3a}
.a-skip {background:#1a1520;color:#4a5568;border:1px solid #232030}

/* ── gain ── */
.gp{font-weight:700;font-size:13px;color:var(--green)}
.gy{font-weight:700;font-size:13px;color:var(--yel)}
.gn{font-weight:700;font-size:13px;color:var(--red)}
.g0{font-size:12px;color:var(--muted)}

/* ── mc ── */
.mc-now{font-size:13px;font-weight:700;color:var(--hi)}
.mc-start{font-size:12px;color:var(--dim)}
@keyframes fl{0%,100%{opacity:1}25%{color:var(--green)}}
.flash{animation:fl .5s ease}

/* ── duration ── */
.dur{font-size:12px;color:var(--dim)}

/* ── bundler ── */
.bbar{display:flex;align-items:center;gap:5px;font-size:11px}
.btrack{width:38px;height:3px;background:var(--srf2);border-radius:2px;overflow:hidden}
.bfill{height:100%;border-radius:2px}

/* ── score ── */
.sc-wrap{display:flex;align-items:center;gap:6px}
.sc-bar{width:50px;height:4px;background:var(--srf2);border-radius:2px;overflow:hidden}
.sc-fill{height:100%;border-radius:2px;transition:width .3s}
.sc-lbl{font-size:11px;color:var(--dim);white-space:nowrap}

/* ── links ── */
.lnk{display:inline-flex;align-items:center;padding:2px 7px;font-size:11px;border-radius:3px;background:var(--srf2);border:1px solid var(--bd);color:var(--dim);text-decoration:none;margin-right:3px;transition:color .1s,border-color .1s}
.lnk:hover{color:var(--blue);border-color:var(--blue)}

/* ── empty ── */
.empty td{padding:60px;text-align:center;color:var(--muted)}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">GMGN <em>Scanner</em></div>
  <div class="stat"><div class="dot" id="dot"></div><span id="stxt">connecting…</span></div>
  <div class="stat">Scans <b id="scans">—</b></div>
  <div class="stat">Seen <b id="seen">—</b></div>
  <div class="stat">Uptime <b id="up">—</b></div>
  <div class="stat">Watching <b id="wtotal">—</b></div>
  <div class="topbar-right">
    <span class="nfa">⚠️ Not financial advice — DYOR</span>
    <span class="lastupd" id="lastupd">—</span>
  </div>
</div>

<div class="sortbar">
  <span class="sortbar-label">SORT</span>
  <div class="sb on" data-sort="gainPct">Gain %</div>
  <div class="sb" data-sort="currentMC">MC Now</div>
  <div class="sb" data-sort="score">Score</div>
  <div class="sb" data-sort="addedAt">Duration</div>
  <div class="filter-sep"></div>
  <span class="sortbar-label">FILTER</span>
  <div class="type-filter">
    <div class="tf tf-all on" data-filter="all">ALL</div>
    <div class="tf tf-new" data-filter="new">NEW</div>
    <div class="tf tf-near" data-filter="near_completion">NEAR</div>
    <div class="tf tf-grad" data-filter="completed">GRAD</div>
  </div>
</div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:195px">Token</th>
        <th style="width:65px">Type</th>
        <th style="width:115px">Action</th>
        <th style="width:100px">Gain %</th>
        <th style="width:105px">Start MC</th>
        <th style="width:110px">MC Now</th>
        <th style="width:90px">Duration</th>
        <th style="width:130px">Bundler / Hold</th>
        <th style="width:75px">SM / KOL</th>
        <th style="width:120px">Score</th>
        <th>Links</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty"><td colspan="11">Connecting to scanner…</td></tr>
    </tbody>
  </table>
</div>

<script>
const API = '/api/state', TICK = 5000;

// ── Formatters ──
const fU = v => {
  if (!v || isNaN(v)) return '—';
  if (v >= 1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return '$'+(v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return '$'+(v/1e3).toFixed(1)+'K';
  return '$'+Number(v).toFixed(0);
};
const fDur = ts => {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return s+'s';
  const m = Math.floor(s/60);
  if (m < 60) return m+'m '+(s%60)+'s';
  return Math.floor(m/60)+'h '+(m%60)+'m';
};
const fTime = ts => new Date(ts).toLocaleTimeString('en-US',{hour12:false});

// ── Gain html ──
const gainHtml = g => {
  if (g == null) return '<span class="g0">—</span>';
  const s = g >= 0 ? '+' : '';
  if (g >= 100) return `<span class="gp">${s}${g.toFixed(2)}%</span>`;
  if (g >= 0)   return `<span class="gy">${s}${g.toFixed(2)}%</span>`;
  return              `<span class="gn">${g.toFixed(2)}%</span>`;
};

// ── Action html ──
const actionHtml = (label, icon) => {
  if (!label) return '<span class="act a-skip">— —</span>';
  const cls = label === 'BUY' ? 'a-buy' : label === 'WATCH' ? 'a-watch' : label === 'WAIT' ? 'a-wait' : 'a-skip';
  return `<span class="act ${cls}">${icon||''} ${label}</span>`;
};

// ── Score bar html ──
const scoreHtml = (score, max) => {
  if (score == null || !max) return '<span class="g0">—</span>';
  const p = score/max;
  const col = p >= .55 ? 'var(--green)' : p >= .35 ? 'var(--yel)' : p >= .2 ? 'var(--org)' : 'var(--muted)';
  const lbl = p >= .55 ? 'STRONG' : p >= .35 ? 'SIGNAL' : p >= .2 ? 'WATCH' : 'LOW';
  return `<div class="sc-wrap">
    <div class="sc-bar"><div class="sc-fill" style="width:${(p*100).toFixed(0)}%;background:${col}"></div></div>
    <span class="sc-lbl">${score}/${max} <span style="color:${col}">${lbl}</span></span>
  </div>`;
};

// ── Bundler bar html ──
const bHtml = (rate, hold) => {
  if (rate == null && hold == null) return '<span class="g0">—</span>';
  const r = rate != null ? Math.round(rate*100) : 0;
  const h = hold != null ? Math.round(hold*100) : 0;
  const rc = r < 20 ? 'var(--green)' : r < 40 ? 'var(--yel)' : 'var(--org)';
  const hc = h >= 20 && h <= 70 ? 'var(--green)' : 'var(--org)';
  return `<div class="bbar">
    <span style="color:${rc};width:26px">${r}%</span>
    <div class="btrack"><div class="bfill" style="width:${Math.min(r,100)}%;background:${rc}"></div></div>
    <span style="color:${hc}">${h}%h</span>
  </div>`;
};

// ── Links html ──
const fmtXUrl = url => {
  if (!url) return null;
  if (url.startsWith('http')) return url.replace('twitter.com', 'x.com');
  if (url.startsWith('@'))    return 'https://x.com/' + url.slice(1);
  return 'https://x.com/' + url;
};
const lHtml = t => [
  `<a class="lnk" href="https://gmgn.ai/sol/token/${t.address}" target="_blank">GMGN</a>`,
  `<a class="lnk" href="https://pump.fun/${t.address}" target="_blank">Pump</a>`,
  t.twitter  ? `<a class="lnk" href="${fmtXUrl(t.twitter)}" target="_blank">X</a>` : '',
  t.telegram ? `<a class="lnk" href="${t.telegram}" target="_blank">TG</a>` : '',
].join('');

// ── Copy addr ──
const cp = addr => navigator.clipboard.writeText(addr).catch(()=>{});

// ── Type badge ──
const typeBadge = type => {
  if (type === 'new')             return '<span class="type-new">NEW</span>';
  if (type === 'near_completion') return '<span class="type-near">NEAR</span>';
  return '<span class="type-grad">GRAD</span>';
};

// ── Current MC estimate ──
const curMC = t => {
  if (!t.marketCap) return null;
  if (t.firstOpen && t.currentClose && t.firstOpen > 0)
    return (t.currentClose / t.firstOpen) * t.marketCap;
  return t.marketCap;
};

// ── State ──
let allRows = [];
let sortKey = 'gainPct', sortDir = -1, filterType = 'all';
const prevMC = {};

// ── Sort buttons ──
document.querySelectorAll('.sb').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.sort;
    if (sortKey === k) sortDir *= -1;
    else { sortKey = k; sortDir = -1; }
    document.querySelectorAll('.sb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
  });
});

// ── Filter buttons ──
document.querySelectorAll('.tf').forEach(btn => {
  btn.addEventListener('click', () => {
    filterType = btn.dataset.filter;
    document.querySelectorAll('.tf').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
  });
});

// ── Render ──
function render() {
  let rows = filterType === 'all' ? allRows : allRows.filter(r => r.type === filterType);

  // Sort
  rows = [...rows].sort((a, b) => {
    const av = a[sortKey] ?? (sortDir === -1 ? -Infinity : Infinity);
    const bv = b[sortKey] ?? (sortDir === -1 ? -Infinity : Infinity);
    return av < bv ? sortDir : av > bv ? -sortDir : 0;
  });

  const tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = `<tr class="empty"><td colspan="11">No tokens being tracked yet</td></tr>`;
    return;
  }

  tb.innerHTML = rows.map(t => {
    const mc    = curMC(t);
    const key   = t.type + t.address;
    const fl    = prevMC[key] != null && prevMC[key] !== mc ? 'flash' : '';
    prevMC[key] = mc;
    const isHit = t.hitAt || (t.lastMultiple && t.lastMultiple > 1);
    return `<tr class="${isHit ? 'hit' : ''}">
      <td><div class="tok">
        <div class="ico">${(t.symbol||'?').slice(0,2)}</div>
        <div class="tok-info">
          <span class="sym">$${t.symbol}</span>
          <span class="tname">${t.name||''}</span>
          <span class="addr" onclick="cp('${t.address}')" title="Click to copy">${t.address.slice(0,8)}…${t.address.slice(-4)}</span>
        </div>
      </div></td>
      <td>${typeBadge(t.type)}</td>
      <td>${actionHtml(t.action, t.actionIcon)}</td>
      <td>${gainHtml(t.gainPct)}</td>
      <td><span class="mc-start">${fU(t.marketCap)}</span></td>
      <td><span class="mc-now ${fl}">${fU(mc)}</span></td>
      <td><span class="dur">${fDur(t.addedAt)}</span></td>
      <td>${bHtml(t.bundlerRate, t.bundlerHold)}</td>
      <td style="color:var(--text);font-size:12px"><b>${t.smartMoney??0}</b><span style="color:var(--muted)"> / ${t.kol??0}</span></td>
      <td>${scoreHtml(t.score, t.maxScore||10)}</td>
      <td>${lHtml(t)}</td>
    </tr>`;
  }).join('');
}

// ── Fetch ──
async function refresh() {
  try {
    const d = await fetch(API).then(r => r.json());

    document.getElementById('dot').className = 'dot';
    document.getElementById('stxt').textContent = 'live';
    document.getElementById('scans').textContent = d.session.scanCount;
    document.getElementById('seen').textContent  = d.session.totalSeen;
    document.getElementById('up').textContent    = d.session.uptime;
    document.getElementById('lastupd').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});

    const newRows  = (d.watchlist       || []).map(t => ({ ...t, type: 'new',             kol: 0 }));
    const gradRows = (d.graduationWatch || []);

    allRows = [...newRows, ...gradRows];
    document.getElementById('wtotal').textContent = allRows.length;

    render();
  } catch {
    document.getElementById('dot').className = 'dot off';
    document.getElementById('stxt').textContent = 'offline';
  }
}

refresh();
setInterval(refresh, TICK);
</script>
</body>
</html>
